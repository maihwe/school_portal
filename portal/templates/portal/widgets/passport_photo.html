{% if widget.is_initial %}
<div class="admin-photo-current">
  <img src="{{ widget.value.url }}" alt="Current passport photograph" width="64" height="64">
  <a class="admin-link" href="{{ widget.value.url }}" target="_blank" rel="noopener">View current photograph</a>
</div>
{% if not widget.required %}
<label class="admin-photo-clear" for="{{ widget.checkbox_id }}">
  <input type="checkbox" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}"{% if widget.attrs.disabled %} disabled{% endif %}{% if widget.attrs.checked %} checked{% endif %}>
  Remove current photograph
</label>
{% endif %}
{% endif %}
<input type="{{ widget.type }}" name="{{ widget.name }}"{% include 'django/forms/widgets/attrs.html' %}>
